; generated by le-dwm-config: macOS-style application dock (polybar)
; toggled by dwm-dock (Super+P when the dock is active).

include-file = ~/.config/polybar/colors.ini

[bar/dock]
monitor = ${env:MONITOR:}
width = 40%
height = 52
offset-x = 30%
offset-y = 8
bottom = true
fixed-center = true
override-redirect = true
wm-restack = 
radius = 16.0

background = ${colors.bg}
foreground = ${colors.fg}

border-size = 1
border-color = ${colors.bg-hi}
border-radius = 16

padding-left = 8
padding-right = 8
module-margin = 4

font-0 = "JetBrainsMono Nerd Font:size=20;4"
font-1 = "JetBrainsMono Nerd Font:size=12;2"

modules-center = launcher term web files code settings

cursor-click = pointer
cursor-scroll = ns-resize

[module/launcher]
type = custom/text
content = "󰀻"
content-foreground = ${colors.accent}
content-padding = 2
click-left = rofi -show drun -show-icons -theme ~/.config/rofi/dock.rasi &
click-right = dmenu_run &

[module/term]
type = custom/text
content = ""
content-foreground = ${colors.fg}
content-padding = 2
click-left = kitty &

[module/web]
type = custom/text
content = ""
content-foreground = ${colors.fg}
content-padding = 2
click-left = firefox &

[module/files]
type = custom/text
content = ""
content-foreground = ${colors.fg}
content-padding = 2
click-left = thunar &

[module/code]
type = custom/text
content = ""
content-foreground = ${colors.fg}
content-padding = 2
click-left = code &

[module/settings]
type = custom/text
content = ""
content-foreground = ${colors.fg}
content-padding = 2
click-left = dwm-bar pick &
